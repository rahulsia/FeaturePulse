server {
 listen 8080;
 server_name _;
 server_tokens off;
 client_max_body_size 55m;

 # No inline-script usage in the built app, so a strict default-src is safe. frame-ancestors
 # 'none' stops this app itself being framed (clickjacking); frame-src allows the in-app
 # browser preview to embed other sites, which is a deliberate feature, not a gap.
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; frame-src http: https:; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;

 location /api/ { proxy_pass http://backend:8000/; proxy_read_timeout 300s; }
 location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
