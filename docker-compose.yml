services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: featurepulse
      POSTGRES_USER: featurepulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featurepulse"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://featurepulse:${POSTGRES_PASSWORD}@db:5432/featurepulse
      STORAGE_DIR: /app/uploads
      API_TOKEN: ${API_TOKEN:-}
    volumes:
      - evidence:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - backend
volumes:
  pgdata:
  evidence:
